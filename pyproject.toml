[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarpath"
version = "0.1.0"
description = "ScholarPath: multi-granularity semantic indexing and budgeted support-path retrieval for evidence and hypothesis queries over scholarly repositories"
readme = "README.md"
license-files = ["THIRD_PARTY_NOTICES.md", "LICENSES/*"]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
llm = [
    "openai>=1.30",
    "tiktoken>=0.7",
]
embeddings = [
    "torch>=2.0",
    "transformers>=4.40",
    "adapters>=1.0",
    "sentence-transformers>=2.7",
]
data = [
    "datasets>=2.19",   # Hugging Face downloads (ResearchQA, CHIME annotations)
    "pandas>=1.5",      # parquet files of ResearchQA / CHIME annotations
    "pyarrow>=12",
    "pymupdf>=1.24",    # PDF text extraction (prepare_fulltext.py)
]
eval = [
    "nltk>=3.8",  # statement splitting of the official ScholarQABench citation eval; run nltk.download("punkt")
]
baselines = [
    "umap-learn>=0.5",  # RAPTOR dimensionality reduction (PCA fallback otherwise)
    "networkx>=3.1",    # LightRAG knowledge-graph export
]
agents = [
    "paper-qa>=5.0",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",        # ruff check src scripts tests
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["scholarpath*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["F"]  # pyflakes: unused imports / names, undefined names
